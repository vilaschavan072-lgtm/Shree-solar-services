name: Build Shree Solar Services APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir android-project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'Shree*Solar*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip "$ZIP_FILE" -d android-project

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Solar-Services-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
